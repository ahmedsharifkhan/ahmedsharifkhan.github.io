# --- FAQ ---
faq:
  eyebrow: "FAQ"
  title: "Frequently Asked Questions"
  items:
    - question: "What platforms do you run ads on?"
      answer: "I manage paid campaigns on Meta (Facebook & Instagram), Google Ads (Search, Display, YouTube, Performance Max), TikTok Ads, and LinkedIn Ads. I can also help with Pinterest and Twitter Ads."
    - question: "What is your minimum ad budget?"
      answer: "For Meta and Google Ads, I recommend a minimum budget of $500–$1,000/month to see meaningful results. For TikTok and LinkedIn, $1,000+/month is ideal. Budget depends on your industry, goals, and competition."
    - question: "How soon can I expect results?"
      answer: "Most campaigns start showing data within the first week. Meaningful results and optimisations typically come after 2–4 weeks of data collection. Significant ROAS improvements are usually visible by month 2–3."
    - question: "Do you offer campaign management or just setup?"
      answer: "Both. I offer one-time campaign setup & audit services as well as ongoing monthly management including daily monitoring, weekly optimisations, and monthly performance reports."
    - question: "How do you track campaign performance?"
      answer: "I use Meta Pixel with Conversion API (CAPI), Google Tag Manager, GA4, and UTM parameters for full cross-channel attribution. You get transparent access to all dashboards and a monthly report."
    - question: "Can you work with my existing team?"
      answer: "Absolutely. I collaborate closely with in-house teams, designers, content creators, and developers. I can also handle everything end-to-end if you prefer a single point of contact."
