title: About Me
subtitle: Digital Marketing Specialist & Media Buying Expert
tagline: I help businesses grow through data-driven paid advertising — Meta, Google, TikTok, and beyond.

bio: |
  Hi, I'm <strong>Ahmed Sharif Khan Noor</strong> — a results-driven Digital Marketing Specialist based in Mirpur, Dhaka, Bangladesh. With 3+ years of hands-on experience in paid media, I've managed multi-platform campaigns across Meta, Google, TikTok, and LinkedIn, consistently delivering measurable ROI for businesses across the US, UK, UAE, and Bangladesh.
  <br><br>
  I started my journey with a BBA from EXIM Bank Agricultural University Bangladesh, where I developed a deep interest in marketing strategy and consumer behaviour. Since then, I've worked with global brands, local businesses, and e-commerce stores — helping them turn ad spend into real revenue.
  <br><br>
  I believe great marketing is half creativity, half data. I combine compelling storytelling with conversion tracking, pixel setup, UTM attribution, and continuous A/B testing to make every rupee of your budget work harder.

