<!-- ══════════════ SEARCH OVERLAY ══════════════ -->
<div id="srchOverlay" class="srch-overlay" role="dialog" aria-modal="true" aria-label="Search" aria-hidden="true">
  <div class="srch-backdrop" onclick="srchClose()"></div>
  <div class="srch-panel">

    <!-- Top bar -->
    <div class="srch-topbar">
      <div class="srch-logo">Ahmed Sharif Khan Noor</div>
      <button class="srch-close-btn" onclick="srchClose()" aria-label="Close search">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Search Input -->
    <div class="srch-input-row">
      <div class="srch-input-wrap">
        <i class="fas fa-search srch-mag"></i>
        <input type="text" id="srchInput"
               class="srch-input"
               placeholder="Search articles, topics, platforms…"
               autocomplete="off" spellcheck="false"
               aria-label="Search">
        <button class="srch-clear-btn" id="srchClearBtn" onclick="srchClear()" aria-label="Clear" style="display:none">
          <i class="fas fa-times-circle"></i>
        </button>
      </div>
    </div>

    <!-- Body -->
    <div class="srch-body">

      <!-- Initial state: popular topics -->
      <div id="srchInitial" class="srch-initial">
        <p class="srch-topics-label">Popular Topics</p>
        <div class="srch-topic-pills">
          <button onclick="srchTrigger('Meta Ads')"    class="srch-pill">Meta Ads</button>
          <button onclick="srchTrigger('Google Ads')"  class="srch-pill">Google Ads</button>
          <button onclick="srchTrigger('TikTok Ads')"  class="srch-pill">TikTok Ads</button>
          <button onclick="srchTrigger('LinkedIn Ads')"class="srch-pill">LinkedIn Ads</button>
          <button onclick="srchTrigger('GTM')"         class="srch-pill">GTM</button>
          <button onclick="srchTrigger('GA4')"         class="srch-pill">GA4</button>
          <button onclick="srchTrigger('ROAS')"        class="srch-pill">ROAS</button>
          <button onclick="srchTrigger('Conversion')"  class="srch-pill">Conversion</button>
        </div>
      </div>

      <!-- Results header -->
      <div id="srchResultsMeta" class="srch-results-meta" style="display:none">
        <span id="srchResultsCount"></span>
        <span class="srch-results-term">for "<strong id="srchResultsTerm"></strong>"</span>
      </div>

      <!-- Results list -->
      <div id="srchResults" class="srch-results-list" style="display:none"></div>

      <!-- No results -->
      <div id="srchEmpty" class="srch-empty" style="display:none">
        <i class="fas fa-search-minus srch-empty-icon"></i>
        <p>No results for "<strong id="srchEmptyTerm"></strong>"</p>
        <small>Try different keywords — Meta Ads, Google Ads, GTM…</small>
      </div>

    </div><!-- /srch-body -->
  </div><!-- /srch-panel -->
</div>

<!-- ══════════════ STYLES ══════════════ -->
<style>
/* Overlay */
.srch-overlay {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; flex-direction: column;
  background: rgba(10,14,22,.92);
  backdrop-filter: blur(8px);
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease;
}
.srch-overlay.srch-open {
  opacity: 1; pointer-events: all;
}
.srch-backdrop {
  position: absolute; inset: 0; z-index: 0;
}
.srch-panel {
  position: relative; z-index: 1;
  width: 100%; max-width: 820px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex; flex-direction: column;
  max-height: 100vh; overflow: hidden;
}

/* Top bar */
.srch-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 0 20px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  flex-shrink: 0;
}
.srch-logo {
  font-size: .82rem; font-weight: 800; color: rgba(255,255,255,.5);
  letter-spacing: .04rem;
}
.srch-close-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
  color: rgba(255,255,255,.7); font-size: .95rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, color .2s;
}
.srch-close-btn:hover { background: rgba(255,255,255,.18); color: #fff; }

/* Input row */
.srch-input-row { padding: 28px 0 0; flex-shrink: 0; }
.srch-input-wrap {
  position: relative; display: flex; align-items: center;
}
.srch-mag {
  position: absolute; left: 18px;
  font-size: 1.1rem; color: rgba(255,255,255,.35);
  pointer-events: none;
}
.srch-input {
  width: 100%; padding: 16px 52px 16px 52px;
  background: rgba(255,255,255,.07);
  border: 1.5px solid rgba(255,255,255,.12);
  border-radius: 14px;
  font-size: 1.15rem; font-weight: 500; color: #fff;
  outline: none;
  transition: border-color .2s, background .2s;
  caret-color: #4a9eff;
}
.srch-input::placeholder { color: rgba(255,255,255,.3); }
.srch-input:focus {
  border-color: #4a9eff;
  background: rgba(74,158,255,.06);
}
.srch-clear-btn {
  position: absolute; right: 16px;
  background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,.35); font-size: 1rem;
  transition: color .2s;
}
.srch-clear-btn:hover { color: rgba(255,255,255,.7); }

/* Body (scrollable) */
.srch-body {
  flex: 1; overflow-y: auto; padding: 24px 0 40px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.15) transparent;
}
.srch-body::-webkit-scrollbar { width: 4px; }
.srch-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

/* Initial: popular topics */
.srch-initial { padding-top: 8px; }
.srch-topics-label {
  font-size: .72rem; font-weight: 700; letter-spacing: .1rem;
  color: rgba(255,255,255,.35); text-transform: uppercase; margin-bottom: 14px;
}
.srch-topic-pills { display: flex; flex-wrap: wrap; gap: 10px; }
.srch-pill {
  display: inline-flex; align-items: center;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  color: rgba(255,255,255,.65); font-size: .82rem; font-weight: 600;
  padding: 7px 16px; border-radius: 30px; cursor: pointer;
  transition: background .2s, border-color .2s, color .2s;
}
.srch-pill:hover {
  background: rgba(74,158,255,.15); border-color: #4a9eff; color: #4a9eff;
}

/* Results meta */
.srch-results-meta {
  font-size: .78rem; color: rgba(255,255,255,.4);
  margin-bottom: 18px; padding-top: 6px;
}
#srchResultsCount { font-weight: 700; color: rgba(255,255,255,.6); margin-right: 4px; }

/* Results list */
.srch-results-list { display: flex; flex-direction: column; gap: 2px; }

.srch-result-item {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 16px; border-radius: 12px;
  background: rgba(255,255,255,.04);
  border: 1px solid transparent;
  text-decoration: none !important;
  transition: background .18s, border-color .18s;
}
.srch-result-item:hover {
  background: rgba(74,158,255,.08);
  border-color: rgba(74,158,255,.2);
}
.srch-result-img {
  width: 80px; height: 60px; border-radius: 8px;
  object-fit: cover; flex-shrink: 0;
}
.srch-result-img-ph {
  width: 80px; height: 60px; border-radius: 8px; flex-shrink: 0;
  background: rgba(74,158,255,.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; color: rgba(74,158,255,.5);
}
.srch-result-body { flex: 1; min-width: 0; }
.srch-result-meta {
  display: flex; align-items: center; gap: 10px; margin-bottom: 5px; flex-wrap: wrap;
}
.srch-result-cat {
  font-size: .65rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08rem;
  background: rgba(74,158,255,.2); color: #4a9eff;
  padding: 2px 8px; border-radius: 20px;
}
.srch-result-date {
  font-size: .72rem; color: rgba(255,255,255,.3);
  display: flex; align-items: center; gap: 4px;
}
.srch-result-title {
  font-size: .94rem; font-weight: 700; color: rgba(255,255,255,.88);
  line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin: 0 0 4px;
}
.srch-result-desc {
  font-size: .78rem; color: rgba(255,255,255,.4);
  line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0;
}

/* No results */
.srch-empty { text-align: center; padding: 50px 20px; }
.srch-empty-icon { font-size: 2.5rem; color: rgba(255,255,255,.12); margin-bottom: 16px; }
.srch-empty p { font-size: .95rem; color: rgba(255,255,255,.5); margin-bottom: 6px; }
.srch-empty small { font-size: .8rem; color: rgba(255,255,255,.25); }

/* Mobile */
@media(max-width: 575px) {
  .srch-panel { padding: 0 14px; }
  .srch-input { font-size: 1rem; padding: 14px 46px; }
  .srch-result-img, .srch-result-img-ph { width: 60px; height: 46px; }
  .srch-result-title { font-size: .88rem; }
  .srch-topbar { padding: 16px 0 14px; }
}
</style>

<!-- ══════════════ SCRIPT ══════════════ -->
<script>
(function () {
  var overlay   = document.getElementById('srchOverlay');
  var input     = document.getElementById('srchInput');
  var clearBtn  = document.getElementById('srchClearBtn');
  var initial   = document.getElementById('srchInitial');
  var results   = document.getElementById('srchResults');
  var resMeta   = document.getElementById('srchResultsMeta');
  var resCount  = document.getElementById('srchResultsCount');
  var resTerm   = document.getElementById('srchResultsTerm');
  var empty     = document.getElementById('srchEmpty');
  var emptyTerm = document.getElementById('srchEmptyTerm');
  var debounceT = null;

  window.srchOpen = function () {
    overlay.classList.add('srch-open');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    setTimeout(function () { input.focus(); }, 80);
    if (window.dataLayer) dataLayer.push({ event: 'search_open' });
  };

  window.srchClose = function () {
    overlay.classList.remove('srch-open');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  };

  window.srchClear = function () {
    input.value = '';
    clearBtn.style.display = 'none';
    showInitial();
    input.focus();
  };

  window.srchTrigger = function (term) {
    input.value = term;
    clearBtn.style.display = 'block';
    doSearch(term);
    input.focus();
  };

  function showInitial() {
    initial.style.display = 'block';
    results.style.display = 'none';
    resMeta.style.display = 'none';
    empty.style.display   = 'none';
  }

  function doSearch(term) {
    if (!term || term.trim().length < 2) { showInitial(); return; }
    initial.style.display = 'none';

    if (typeof idx === 'undefined') {
      results.innerHTML = '<p style="color:rgba(255,255,255,.4);padding:20px 0">Loading search index…</p>';
      results.style.display = 'block';
      resMeta.style.display = 'none';
      empty.style.display   = 'none';
      return;
    }

    var hits;
    try {
      hits = idx.search(term + '*');
      if (!hits.length) hits = idx.search(term);
    } catch (e) {
      try { hits = idx.search(term); } catch (e2) { hits = []; }
    }

    if (window.dataLayer) {
      dataLayer.push({ event: 'search', search_term: term, results_count: hits.length });
    }

    if (!hits.length) {
      results.style.display = 'none';
      resMeta.style.display = 'none';
      empty.style.display   = 'block';
      emptyTerm.textContent = term;
      return;
    }

    empty.style.display   = 'none';
    resMeta.style.display = 'block';
    resCount.textContent  = hits.length + ' result' + (hits.length !== 1 ? 's' : '');
    resTerm.textContent   = term;

    var html = '';
    var limit = Math.min(hits.length, 10);
    for (var i = 0; i < limit; i++) {
      var doc = documents[hits[i].ref];
      var imgHtml = doc.image
        ? '<img src="' + doc.image + '" alt="' + srchEsc(doc.title) + '" class="srch-result-img" loading="lazy">'
        : '<div class="srch-result-img-ph"><i class="fas fa-newspaper"></i></div>';

      var metaHtml = '';
      if (doc.category) metaHtml += '<span class="srch-result-cat">' + srchEsc(doc.category) + '</span>';
      if (doc.date)     metaHtml += '<span class="srch-result-date"><i class="fas fa-calendar-alt"></i>' + srchEsc(doc.date) + '</span>';

      var desc = doc.description ? srchEsc(doc.description.substring(0, 110)) + '…' : '';

      html += '<a href="' + doc.url + '" class="srch-result-item" onclick="srchClose()">'
            + imgHtml
            + '<div class="srch-result-body">'
            + (metaHtml ? '<div class="srch-result-meta">' + metaHtml + '</div>' : '')
            + '<h4 class="srch-result-title">' + srchEsc(doc.title) + '</h4>'
            + (desc ? '<p class="srch-result-desc">' + desc + '</p>' : '')
            + '</div>'
            + '</a>';
    }
    results.innerHTML  = html;
    results.style.display = 'block';
  }

  function srchEsc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Live input
  input.addEventListener('input', function () {
    var v = this.value.trim();
    clearBtn.style.display = v.length ? 'block' : 'none';
    clearTimeout(debounceT);
    debounceT = setTimeout(function () { doSearch(v); }, 200);
  });

  // ESC key closes overlay
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') srchClose();
  });

})();
</script>
